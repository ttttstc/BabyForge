name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy
        run: |
          npm test
          npm run lint
          npm run build

      - name: Verify required R2 buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          buckets="$(npx wrangler r2 bucket list)"
          printf '%s\n' "$buckets"
          grep -q 'babyforge-photos' <<< "$buckets"
          grep -q 'babyforge-photos-preview' <<< "$buckets"

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply babyforge --remote

      - name: Publish production model secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_USE_RESPONSES: ${{ secrets.OPENAI_USE_RESPONSES }}
          LLM_KEY_ENCRYPTION_KEYS: ${{ secrets.LLM_KEY_ENCRYPTION_KEYS }}
          LLM_KEY_ENCRYPTION_KEY_VERSION: ${{ secrets.LLM_KEY_ENCRYPTION_KEY_VERSION }}
          AI_HEALTH_TOKEN: ${{ secrets.AI_HEALTH_TOKEN }}
          BABYFORGE_PRESET_ACCOUNTS: ${{ secrets.BABYFORGE_PRESET_ACCOUNTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO }}
          RESEND_LIST_UNSUBSCRIBE_URL: ${{ secrets.RESEND_LIST_UNSUBSCRIBE_URL }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_BASE_URL"
          test -n "$OPENAI_MODEL"
          test -n "$OPENAI_USE_RESPONSES"
          test -n "$LLM_KEY_ENCRYPTION_KEYS"
          test -n "$LLM_KEY_ENCRYPTION_KEY_VERSION"
          test -n "$AI_HEALTH_TOKEN"
          test -n "$BABYFORGE_PRESET_ACCOUNTS"
          node scripts/validate-llm-keyring.mjs
          printf '%s' "$OPENAI_API_KEY" | npx wrangler pages secret put OPENAI_API_KEY --project-name babyforge
          printf '%s' "$OPENAI_BASE_URL" | npx wrangler pages secret put OPENAI_BASE_URL --project-name babyforge
          printf '%s' "$OPENAI_MODEL" | npx wrangler pages secret put OPENAI_MODEL --project-name babyforge
          printf '%s' "$OPENAI_USE_RESPONSES" | npx wrangler pages secret put OPENAI_USE_RESPONSES --project-name babyforge
          printf '%s' "$LLM_KEY_ENCRYPTION_KEYS" | npx wrangler pages secret put LLM_KEY_ENCRYPTION_KEYS --project-name babyforge
          printf '%s' "$LLM_KEY_ENCRYPTION_KEY_VERSION" | npx wrangler pages secret put LLM_KEY_ENCRYPTION_KEY_VERSION --project-name babyforge
          printf '%s' "$AI_HEALTH_TOKEN" | npx wrangler pages secret put AI_HEALTH_TOKEN --project-name babyforge
          printf '%s' "$BABYFORGE_PRESET_ACCOUNTS" | npx wrangler pages secret put BABYFORGE_PRESET_ACCOUNTS --project-name babyforge
          if [ -n "${RESEND_API_KEY:-}" ] || [ -n "${RESEND_FROM_EMAIL:-}" ]; then
            test -n "$RESEND_API_KEY"
            test -n "$RESEND_FROM_EMAIL"
            printf '%s' "$RESEND_API_KEY" | npx wrangler pages secret put RESEND_API_KEY --project-name babyforge
            printf '%s' "$RESEND_FROM_EMAIL" | npx wrangler pages secret put RESEND_FROM_EMAIL --project-name babyforge
          fi
          if [ -n "${RESEND_REPLY_TO:-}" ]; then
            printf '%s' "$RESEND_REPLY_TO" | npx wrangler pages secret put RESEND_REPLY_TO --project-name babyforge
          fi
          if [ -n "${RESEND_LIST_UNSUBSCRIBE_URL:-}" ]; then
            printf '%s' "$RESEND_LIST_UNSUBSCRIBE_URL" | npx wrangler pages secret put RESEND_LIST_UNSUBSCRIBE_URL --project-name babyforge
          fi

      - name: Deploy Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name babyforge --branch main --commit-hash ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Encrypt legacy account API keys
        env:
          AI_HEALTH_TOKEN: ${{ secrets.AI_HEALTH_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          remaining=1
          for attempt in {1..100}; do
            response="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 -X POST -H "Authorization: Bearer $AI_HEALTH_TOKEN" "$DEPLOYMENT_URL/api/ai/key-migration")"
            remaining="$(RESPONSE="$response" node -e "const result=JSON.parse(process.env.RESPONSE); if (!result.ok || !Number.isSafeInteger(result.remaining)) process.exit(1); process.stdout.write(String(result.remaining))")"
            if [ "$remaining" = "0" ]; then break; fi
          done
          test "$remaining" = "0"

      - name: Verify production model call
        env:
          AI_HEALTH_TOKEN: ${{ secrets.AI_HEALTH_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          EXPECTED_DEPLOYMENT: ${{ github.sha }}
        run: |
          test -n "$DEPLOYMENT_URL"
          provider_url="$(BASE_URL="$OPENAI_BASE_URL" node -e "const url=new URL(process.env.BASE_URL); if (!url.pathname || url.pathname === '/') url.pathname='/v1'; process.stdout.write(url.toString().replace(/\/+$/, '') + '/models')")"
          provider_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $OPENAI_API_KEY" "$provider_url")"
          echo "Provider credential preflight status: $provider_status"
          for attempt in {1..12}; do
            response="$(curl --silent --show-error --max-time 70 -X POST -H "Authorization: Bearer $AI_HEALTH_TOKEN" https://babyforge.pages.dev/api/ai/health)"
            if RESPONSE="$response" node -e "const result=JSON.parse(process.env.RESPONSE); process.exit(result.deployment === process.env.EXPECTED_DEPLOYMENT.slice(0, 12) ? 0 : 1)"; then break; fi
            sleep 5
          done
          echo "Production model health: $response"
          RESPONSE="$response" node -e "const result=JSON.parse(process.env.RESPONSE); if (!result.ok || result.answerLength < 10 || result.deployment !== process.env.EXPECTED_DEPLOYMENT.slice(0, 12)) process.exit(1); console.log('Production model answered:', result.answerLength, 'characters')"
