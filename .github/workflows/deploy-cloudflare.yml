name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy
        run: |
          npm test
          npm run lint
          npm run build

      - name: Verify required R2 buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          buckets="$(npx wrangler r2 bucket list)"
          printf '%s\n' "$buckets"
          grep -q 'babyforge-photos' <<< "$buckets"
          grep -q 'babyforge-photos-preview' <<< "$buckets"

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply babyforge --remote

      - name: Publish production model secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_USE_RESPONSES: ${{ secrets.OPENAI_USE_RESPONSES }}
          AI_HEALTH_TOKEN: ${{ secrets.AI_HEALTH_TOKEN }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_BASE_URL"
          test -n "$OPENAI_MODEL"
          test -n "$OPENAI_USE_RESPONSES"
          test -n "$AI_HEALTH_TOKEN"
          printf '%s' "$OPENAI_API_KEY" | npx wrangler pages secret put OPENAI_API_KEY --project-name babyforge
          printf '%s' "$OPENAI_BASE_URL" | npx wrangler pages secret put OPENAI_BASE_URL --project-name babyforge
          printf '%s' "$OPENAI_MODEL" | npx wrangler pages secret put OPENAI_MODEL --project-name babyforge
          printf '%s' "$OPENAI_USE_RESPONSES" | npx wrangler pages secret put OPENAI_USE_RESPONSES --project-name babyforge
          printf '%s' "$AI_HEALTH_TOKEN" | npx wrangler pages secret put AI_HEALTH_TOKEN --project-name babyforge

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name babyforge --branch main --commit-hash ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production model call
        env:
          AI_HEALTH_TOKEN: ${{ secrets.AI_HEALTH_TOKEN }}
        run: |
          sleep 10
          response="$(curl --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 70 -X POST -H "Authorization: Bearer $AI_HEALTH_TOKEN" https://babyforge.pages.dev/api/ai/health)"
          echo "Production model health: $response"
          RESPONSE="$response" node -e "const result=JSON.parse(process.env.RESPONSE); if (!result.ok || result.answerLength < 10) process.exit(1); console.log('Production model answered:', result.answerLength, 'characters')"
