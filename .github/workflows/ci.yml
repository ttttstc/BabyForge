name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:high
      - name: Run unit tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Verify web bundle budget
        run: npm run verify:bundle
      - name: Verify Web and Harmony capability contract
        run: npm run verify:cross-end
      - name: Verify HarmonyOS shell policy
        run: npm run verify:harmony
      - name: Verify HarmonyOS candidate contract
        run: npm run verify:harmony:candidate
      - name: Install Chromium for visual checks
        run: npx playwright install --with-deps chromium
      - name: Run experience visual checks
        run: npm run test:visual -- --grep "experience"
